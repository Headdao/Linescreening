[project]
name = "linescreening"
version = "0.1.0"
description = "Triage unread LINE chats on macOS without triggering read receipts, using the Jev decision model."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Headdao" }]
requires-python = ">=3.11"
dependencies = [
    "typesafe-sdk>=0.4.0",
    "pyobjc-framework-Vision>=10.0",
    "pyobjc-framework-Quartz>=10.0",
    "pyobjc-framework-Cocoa>=10.0",
    "pyobjc-framework-Security>=10.0",
    "rich>=13.0",
    "pyyaml>=6.0",
    "pyobjc-framework-applicationservices>=12.2.2",
]

[project.scripts]
linescreening = "linescreening.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "python-dotenv>=1.0",
    "pyobjc-framework-CoreText>=10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/linescreening"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "T20"]
ignore = ["S603", "S607"]  # subprocess with constant argv is reviewed by guards tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]        # asserts are the point of tests
"src/linescreening/cli.py" = ["T201"]  # CLI prints; replaced by rich in Phase 8

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
files = ["src/linescreening"]

[tool.pytest.ini_options]
testpaths = ["tests"]
